<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hung Jury · Jury Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE: plain working beta, quiet, no decoration
   IDEA: a courtroom running sheet
   PICTURE: the TV screen is the picture; phones beside it
   COLOUR and TYPE: charcoal court, white type, one red cue colour; Inter Tight + Inter
   LAYOUT: TV on top, three phones in a row, controls in a strip */
:root{color-scheme:light dark;--bg:light-dark(#eceef0,#101214);--panel:light-dark(#ffffff,#181b1e);--ink:light-dark(#121417,#eef0f2);--muted:light-dark(#6b7178,#8b929a);--line:light-dark(#d6dade,#2a2e33);--tv:#0d0f11;--tvink:#f2f3f4;--cue:#d93b3b;--cue-soft:light-dark(#fbe7e7,#3a1a1a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;min-height:44px}
button:focus-visible{outline:2px solid var(--cue);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:1240px;margin:0 auto;padding:20px max(4vw,14px) 40px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:22px}
.top .note{color:var(--muted);font-size:13px}
.views{display:flex;flex-wrap:wrap;gap:8px}
.views a{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.views a.on{color:var(--ink);border-color:var(--ink)}
/* TV */
.tv{background:var(--tv);color:var(--tvink);border-radius:12px;aspect-ratio:16/9;padding:clamp(16px,3vw,40px);display:grid;grid-template-columns:minmax(0,1fr);gap:20px;position:relative;overflow:hidden}
.tv.has-ex{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.tv .case{font-size:13px;color:#8d949b}
.tv .who{font-family:"Inter Tight",sans-serif;font-size:clamp(14px,1.8vw,20px);color:var(--cue);margin-top:auto}
.tv .said{font-size:clamp(18px,3vw,38px);line-height:1.2;text-wrap:balance}
.tv .main{display:flex;flex-direction:column;gap:10px;min-height:0}
.tv .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--cue);transition:width .4s}
.tv .join{margin:auto;text-align:center;display:grid;gap:14px;justify-items:center}
.qr{width:clamp(120px,20vw,240px);aspect-ratio:1;background:#fff;border-radius:10px;padding:8px}
.exhibit{background:#f6f4ef;color:#1b1b1b;border-radius:6px;padding:16px;font:13px/1.5 ui-monospace,Menlo,monospace;align-self:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .35s ease}
.exhibit .tag{font:600 11px Inter,sans-serif;color:var(--cue);margin-bottom:8px}
.exhibit hr{border:0;border-top:1px dashed #999;margin:8px 0}
.exhibit .row{display:flex;justify-content:space-between;gap:12px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
/* phones */
.phones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.phone{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;height:520px;position:relative;overflow:hidden}
.phone .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.phone .bar h3{font-size:16px}
.phone .bar small{color:var(--muted);font-size:12px}
.roles{display:grid;gap:8px;margin-top:12px}
.roles button{text-align:left;display:flex;justify-content:space-between}
.roles button small{color:var(--muted)}
.script{flex:1;overflow-y:auto;margin-top:10px;display:grid;gap:8px;align-content:start;scroll-behavior:smooth}
.ln{padding:10px 12px;border-radius:10px;border:1px solid transparent;color:var(--muted);font-size:14px}
.ln b{display:block;font-size:11px;font-weight:600}
.ln.past{opacity:.45}
.ln.now{color:var(--ink);border-color:var(--line);background:light-dark(#f5f6f7,#202428)}
.ln.mine{color:var(--ink)}
.ln.mine.now{border-color:var(--cue);background:var(--cue-soft)}
.ln i{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.done{margin-top:10px;width:100%}
.flash{position:absolute;inset:0;background:var(--cue);color:#fff;display:grid;place-items:center;font:600 20px "Inter Tight",sans-serif;opacity:0;pointer-events:none}
.flash.go{animation:fl 1.4s ease}
@keyframes fl{0%,60%{opacity:.95}100%{opacity:0}}
.tone{display:flex;width:fit-content;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);background:light-dark(#eef0f2,#262a2f);border-radius:999px;padding:3px 10px 3px 4px;margin:4px 0 6px}
.tone .te{font-size:16px;line-height:1}
.ln.past .tone{opacity:.7}
.flash .ft{font:500 16px Inter,sans-serif;margin-top:8px;opacity:.9}
.exref{display:block;font-size:11px;font-weight:600;color:var(--cue);margin-top:4px}
.jury{background:var(--tv);color:var(--tvink);border-radius:12px;display:grid;grid-template-columns:minmax(180px,240px) minmax(0,1fr);min-height:min(70vh,640px);overflow:hidden}
.jside{border-right:1px solid #2a2e33;padding:18px;display:flex;flex-direction:column;gap:6px}
.jside .jh{font-size:12px;color:#8d949b;margin:10px 0 4px}
.jside .jh:first-child{margin-top:0}
.jside button{background:transparent;color:var(--tvink);border:1px solid transparent;text-align:left}
.jside button:hover{border-color:#3a3f45}
.jside button.on{border-color:var(--cue);background:#241416}
.jmain{padding:clamp(18px,3vw,40px);display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:min(80vh,720px)}
.exhibit.big{max-width:460px;font-size:15px;align-self:center;margin-top:auto}
.jnote{color:#8d949b;font-size:13px;align-self:center;margin-bottom:auto}
.jt{font-size:clamp(18px,2.4vw,26px)}
.jchips{display:flex;flex-wrap:wrap;gap:8px}
.jchips button{background:transparent;color:var(--tvink);border-color:#3a3f45;min-height:36px;padding:6px 12px;font-size:13px}
.jseg{display:grid;gap:4px;margin-top:6px}
.jsh{font-size:12px;font-weight:600;color:#8d949b;padding:8px 0;border-bottom:1px solid #2a2e33;margin-bottom:4px}
.jline{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#8d949b;font-size:15px;line-height:1.4;padding:8px 12px;min-height:0}
.jline:hover{border-color:#3a3f45}
.jline .jw{display:block;font-size:11px;font-weight:600;color:#6c737a;margin-bottom:2px}
.jline .jw em{font-style:normal;font-weight:400;margin-left:6px}
.jline.me{color:var(--tvink);font-size:clamp(16px,1.8vw,19px)}
.jline.me .jw{color:var(--cue)}
.jline.hl{color:var(--tvink);border-color:var(--cue);background:#241416}
.jlines{display:grid;gap:14px}
.jl{border-left:2px solid #2a2e33;padding-left:14px}
.jq{color:#8d949b;font-size:14px;margin-bottom:4px}
.ja{font-size:clamp(16px,2vw,21px);line-height:1.35}
.ja span{display:block;font-size:11px;color:var(--cue);font-weight:600;margin-bottom:2px}
.jfoot{color:var(--muted);font-size:13px;margin:10px 2px 0}
@media(max-width:700px){.jury{grid-template-columns:minmax(0,1fr)}.jside{border-right:0;border-bottom:1px solid #2a2e33;flex-direction:row;flex-wrap:wrap}.jside .jh{width:100%}}
.notes{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:14px}
.note{flex:1 1 220px;max-width:420px;border-left:3px solid var(--cue);padding:6px 12px;background:rgba(255,255,255,.04);font-size:clamp(12px,1.2vw,15px);color:#b9bec4;line-height:1.35}
.note b{display:block;color:var(--tvink);font-size:clamp(12px,1.25vw,15px);margin-bottom:2px}
.tv.tv-join{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
.keyterms{display:grid;gap:10px;align-content:center}
.keyterms .kh{font-size:13px;color:#8d949b;margin-bottom:2px}
.keyterms .note{max-width:none}
.tv .main .who{margin-top:0}
.tv .main{justify-content:center}
@media(max-width:820px){.tv.tv-join{grid-template-columns:minmax(0,1fr)}}
.jterms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wait{margin:auto;color:var(--muted);text-align:center;font-size:14px}
/* control */
.control{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.control .lbl{font-weight:600;margin-right:auto}
.control .free{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.control .free button{font-size:12px;min-height:34px;padding:4px 10px}
.single{max-width:420px;margin:0 auto}
body.bare .top{display:none}body.bare .wrap{padding:10px}
body.bare .tv{aspect-ratio:auto;height:calc(100vh - 20px)}
body.bare .single .phone{height:calc(100vh - 20px)}
.single .phone{height:calc(100vh - 140px);min-height:480px}
@media(max-width:1000px){.phones{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:820px){.phones{grid-template-columns:minmax(0,1fr)}.tv,.tv.has-ex{aspect-ratio:auto;min-height:260px;grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.flash.go,.exhibit{animation:none}.tv .prog{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">Hung Jury</h1><div class="note" id="status"></div></div>
    <nav class="views" id="views"></nav>
  </div>
  <main id="app"></main>
</div>
<script src="/case.js"></script>
<script>
{
const TONES = {formal:["⚖️","Formal"], confident:["😏","Confident"], dismissive:["😒","Dismissive"], nervous:["😟","Nervous"], unsure:["🤔","Unsure"], probing:["🧐","Probing"], defensive:["😬","Defensive"], pressing:["😤","Pressing"], firm:["😠","Firm"], calm:["😌","Calm"], measured:["😐","Measured"], rattled:["😰","Rattled"], tearful:["🥺","Tearful"], cold:["🥶","Cold"], sarcastic:["🙄","Sarcastic"], angry:["😡","Angry"], gentle:["🙂","Gentle"]};
if (CASE.tones) Object.assign(TONES, CASE.tones);
const toneChip = t => TONES[t] ? `<span class="tone"><span class="te">${TONES[t][0]}</span>${TONES[t][1]}</span>` : "";
const SEGS = CASE.segs;
const SEG_OF = CASE.lines.map(l => l.seg);
/* ---- plain-English side notes ---- */
const GLOSSARY = [
  {t:"The State", w:["the state","prosecution","prosecutor"], d:"The side bringing the charge, on behalf of the community. It has to prove the case."},
  {t:"Defence", w:["defence"], d:"The accused's lawyer. They don't have to prove anything, only test the State's case."},
  {t:"The accused", w:["accused"], d:"The person on trial. Innocent unless the State proves otherwise."},
  {t:"Pleaded not guilty", w:["pleaded not guilty"], d:"The accused has formally denied the charge, so it goes to trial."},
  {t:"Exhibit", w:["exhibit"], d:"A piece of evidence formally shown to the court, labelled with a letter."},
  {t:"Objection", w:["objection"], d:"A lawyer says a question or answer breaks the rules of evidence. The judge decides."},
  {t:"Sustained", w:["sustained"], d:"The judge agrees with the objection. The question or answer doesn't count."},
  {t:"Overruled", w:["overruled"], d:"The judge rejects the objection. The witness answers."},
  {t:"Hearsay", w:["hearsay"], d:"Repeating what someone else said, rather than what you saw yourself. Usually not allowed."},
  {t:"Speculation", w:["speculation"], d:"Asking a witness to guess about something they can't actually know."},
  {t:"Relevance", w:["relevance"], d:"An objection that a question has nothing to do with the charge."},
  {t:"Argumentative", w:["argumentative"], d:"Arguing with the witness instead of asking them a question."},
  {t:"Disregard", w:["disregard"], d:"The jury must ignore what was just said when deciding the case."},
  {t:"Nothing further", w:["nothing further"], d:"The lawyer has finished questioning this witness."},
  {t:"Alibi", w:["alibi"], d:"Evidence that the accused was somewhere else when the crime happened."},
  {t:"Burden of proof", w:["burden"], d:"The job of proving the case. It's always on the State, never the accused."},
  {t:"Beyond reasonable doubt", w:["reasonable doubt"], d:"The bar for guilty. Not absolute certainty, but no doubt that a sensible person would act on."},
  {t:"Acquit", w:["acquit"], d:"To find the accused not guilty."},
  {t:"Unanimous", w:["unanimous"], d:"Every juror has to agree on the verdict."},
  {t:"Verdict", w:["verdict"], d:"The jury's final decision on the charge."},
  {t:"Murder", w:["murder"], d:"Killing someone while meaning to kill them or cause them serious harm."},
  {t:"Manslaughter", w:["manslaughter"], d:"Causing a death by an unlawful act, without meaning to kill or seriously harm."},
  {t:"Arson", w:["arson","wilfully setting fire"], d:"Deliberately setting fire to property."},
  {t:"Direct examination", w:[], d:"A lawyer questions their own witness, to draw out their story."},
  {t:"Cross-examination", w:[], d:"A lawyer questions the other side's witness, to test or break their story."}
].concat(CASE.glossary || []);
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
GLOSSARY.forEach(g => { g.re = g.w.length ? new RegExp("\\b(" + g.w.map(esc).join("|") + ")\\b", "i") : null; });
const gloss = t => GLOSSARY.find(g => g.t === t);
// Terms for line i: each term is explained the first two times it comes up, at most two notes per line.
const notesFor = i => {
  const seen = {}, out = [];
  for (let k = 0; k <= i; k++) {
    const l = CASE.lines[k], here = [];
    const sg = SEG_OF[k] || "", prev = k ? SEG_OF[k - 1] : "";
    if (sg !== prev && /^Direct/.test(SEGS[sg] || "")) here.push("Direct examination");
    if (sg !== prev && /^Cross/.test(SEGS[sg] || "")) here.push("Cross-examination");
    if (l.ex) here.push("Exhibit");
    GLOSSARY.forEach(g => { if (g.re && g.re.test(l.text) && !here.includes(g.t)) here.push(g.t); });
    here.forEach(t => { seen[t] = (seen[t] || 0) + 1; if (k === i && seen[t] <= 2 && out.length < 2) out.push(t); });
  }
  return out.map(gloss).filter(Boolean);
};
const notesHTML = i => { const n = notesFor(i); return n.length ? `<div class="notes">${n.map(g => `<div class="note"><b>${g.t}</b>${g.d}</div>`).join("")}</div>` : ""; };
const KEY_TERMS = ["The State", "Defence", "Exhibit", "Objection", "Beyond reasonable doubt", "Unanimous"];
const keyTermsHTML = () => `<div class="keyterms"><div class="kh">Before we begin · key terms</div>${KEY_TERMS.map(gloss).map(g => `<div class="note"><b>${g.t}</b>${g.d}</div>`).join("")}</div>`;
const roleName = id => (CASE.roles.find(r => r.id === id) || {}).name || id;

/* ---- live sync with the Mac ---- */
let me; try { me = sessionStorage.getItem("hj-me"); } catch (e) {}
if (!me) { me = "p-" + Math.random().toString(36).slice(2, 8); try { sessionStorage.setItem("hj-me", me); } catch (e) {} }
let S = {v:0, line:-1, roles:{}};
let online = false;
const act = a => fetch("/action", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(a)}).catch(() => {});
const connect = () => {
  const es = new EventSource("/events");
  es.onopen = () => { online = true; render(); };
  es.onmessage = ev => { const n = JSON.parse(ev.data); if (n.v !== S.v) adopt(n); };
  es.onerror = () => { online = false; render(); };
};
/* ---- actions (the Mac decides; everyone gets the result) ---- */
const claim = (client, role) => act({type:"claim", client, role});
const leave = client => act({type:"leave", client});
const freeRole = role => act({type:"free", role});
const go = d => act({type:"step", d});
const done = client => act({type:"done", client});
const reset = () => act({type:"reset"});

/* ---- sound (TV only) ---- */
let ac = null;
const gavel = () => {
  if (!ac) return;
  [0, .18].forEach(d => {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + d;
    o.type = "triangle"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(55, t + .15);
    g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .22);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .25);
  });
};

/* ---- views ---- */
const VIEWS = [["demo","All in one"],["phone","Phone"],["tv","TV"],["control","Control"],["jury","Jury room"]];
let pick = "ex:A", hl = -1;
const app = document.getElementById("app"), nav = document.getElementById("views");
const view = () => VIEWS.some(v => v[0] === location.hash.slice(1)) ? location.hash.slice(1) : "demo";
let lastLine = {}, joinURL = "";
fetch("/info").then(r => r.json()).then(i => { joinURL = i.joinURL; render(); }).catch(() => {});

const tvHTML = () => {
  const l = CASE.lines[S.line];
  if (!l) return `<div class="tv tv-join"><div class="join"><div class="case">${CASE.title}</div><img class="qr" src="/qr.svg" alt="QR code to join"><div class="case jurl">${joinURL}</div><div class="said" style="font-size:clamp(16px,2.4vw,26px)">Scan to take your role</div><div class="case">${Object.keys(S.roles).length} of ${CASE.roles.length} roles taken</div></div>${keyTermsHTML()}</div>`;
  const ex = l.ex ? CASE.exhibits[l.ex] : null;
  const pct = ((S.line + 1) / CASE.lines.length) * 100;
  return `<div class="tv ${ex ? "has-ex" : ""}"><div class="main"><div class="case">${CASE.title} · line ${S.line + 1} of ${CASE.lines.length}</div><div class="who">${roleName(l.who)}</div><div class="said">${l.text}</div>${notesHTML(S.line)}</div>${ex ? `<div class="exhibit"><div class="tag">${ex.tag}</div>${ex.html}</div>` : ""}<div class="prog" style="width:${pct}%"></div></div>`;
};

const phoneHTML = (client, label) => {
  const mine = Object.keys(S.roles).find(r => S.roles[r] === client);
  if (!mine) {
    return `<div class="phone" data-c="${client}"><div class="bar"><h3>Pick your role</h3><small>${label}</small></div><div class="roles">${CASE.roles.map(r => {
      const taken = S.roles[r.id];
      return `<button data-claim="${r.id}" data-c="${client}" ${taken ? "disabled" : ""}><span>${r.name}</span><small>${taken ? "taken" : ""}</small></button>`;
    }).join("")}</div><div class="flash"></div></div>`;
  }
  const cur = CASE.lines[S.line];
  const body = S.line < 0
    ? `<div class="wait">Waiting for the trial to start.<br>You are the ${roleName(mine)}.</div>`
    : `<div class="script">${CASE.lines.map((l, i) => `<div class="ln ${i < S.line ? "past" : ""} ${i === S.line ? "now" : ""} ${l.who === mine ? "mine" : ""}" ${i === S.line ? 'data-now="1"' : ""}><b>${roleName(l.who)}</b>${l.who === mine ? toneChip(l.tone) : ""}${l.who === mine || i <= S.line ? l.text : "…"}${l.ex && i <= S.line ? `<span class="exref">Exhibit ${l.ex} on screen</span>` : ""}${l.note && l.who === mine ? `<i>${l.note}</i>` : ""}</div>`).join("")}</div>`;
  const myTurn = cur && cur.who === mine;
  return `<div class="phone" data-c="${client}"><div class="bar"><h3>${roleName(mine)}</h3><button data-leave="${client}" style="min-height:32px;padding:4px 10px;font-size:12px">Change</button></div>${body}${myTurn ? `<button class="primary done" data-next="${client}">Done, next line</button>` : ""}<div class="flash"></div></div>`;
};

const controlHTML = () => `<div class="control"><span class="lbl">Control · ${S.line < 0 ? "not started" : `line ${S.line + 1} of ${CASE.lines.length}`}</span>
  ${S.line < 0 ? `<button class="primary" data-step="1">Start trial</button>` : `<button data-step="-1">Back a line</button><button data-step="1" ${S.line >= CASE.lines.length - 1 ? "disabled" : ""}>Next line</button>`}
  <button data-reset="1">Reset</button><button data-sound="1">${ac ? "TV sound on" : "Turn on TV sound"}</button>
  <div class="free">${CASE.roles.map(r => S.roles[r.id] ? `<button data-free="${r.id}">Free ${r.name}</button>` : "").join("")}</div></div>`;

const segBlocks = (segs, focus) => segs.map(s => `<section class="jseg" id="seg-${s}"><div class="jsh">${SEGS[s]}</div>${CASE.lines.map((l, i) => [l, i]).filter(([, i]) => SEG_OF[i] === s).map(([l, i]) => `<button class="jline ${focus && l.who === focus ? "me" : ""} ${focus ? "" : (i === hl ? "hl" : "")}" data-jump="${i}" data-line="${i}"><span class="jw">${roleName(l.who)} <em>line ${i + 1}</em></span>${l.text}${l.ex ? `<span class="exref">Exhibit ${l.ex}</span>` : ""}</button>`).join("")}</section>`).join("");

const juryHTML = () => {
  const exIds = Object.keys(CASE.exhibits);
  const people = CASE.roles.filter(r => CASE.lines.some(l => l.who === r.id));
  const side = `<div class="jside"><div class="jh">Evidence</div>${exIds.map(id => `<button data-pick="ex:${id}" class="${pick === "ex:" + id ? "on" : ""}">${CASE.exhibits[id].tag}</button>`).join("")}<div class="jh">Testimony</div><button data-pick="terms:all" class="${pick === "terms:all" ? "on" : ""}">Key terms</button><button data-pick="rec:all" class="${pick === "rec:all" ? "on" : ""}">Full record</button>${people.map(r => `<button data-pick="who:${r.id}" class="${pick === "who:" + r.id ? "on" : ""}">${r.name}</button>`).join("")}</div>`;
  let main = "";
  const [kind, id] = pick.split(":");
  if (kind === "ex") {
    const ex = CASE.exhibits[id];
    const said = CASE.lines.map((l, i) => [l, i]).filter(([l]) => l.ex === id);
    main = `<div class="jmain"><div class="exhibit big"><div class="tag">${ex.tag}</div>${ex.html}</div>${said.length ? `<div class="jnote">First raised at line ${said[0][1] + 1} by ${roleName(said[0][0].who)}</div>` : ""}</div>`;
  } else if (kind === "terms") {
    main = `<div class="jmain"><h2 class="jt">Key terms</h2><div class="jterms">${GLOSSARY.map(g => `<div class="note"><b>${g.t}</b>${g.d}</div>`).join("")}</div></div>`;
  } else if (kind === "rec") {
    main = `<div class="jmain"><h2 class="jt">Full record</h2>${segBlocks(Object.keys(SEGS), "")}</div>`;
  } else {
    const mySegs = Object.keys(SEGS).filter(s => CASE.lines.some((l, i) => SEG_OF[i] === s && l.who === id));
    main = `<div class="jmain"><h2 class="jt">${roleName(id)}</h2><div class="jchips">${mySegs.map(s => `<button data-seg="${s}">${SEGS[s].split(" · ")[0]}</button>`).join("")}</div>${segBlocks(mySegs, id)}</div>`;
  }
  return `<div class="jury">${side}${main}</div><p class="jfoot">The record is only what was said here. Anything not in it was never raised at trial.</p>`;
};

const render = () => {
  const v = view();
  document.getElementById("title").textContent = "Hung Jury · " + CASE.title;
  document.getElementById("status").textContent = online ? "Connected to the Mac" : "Not connected to the Mac. Retrying…";
  document.body.classList.toggle("bare", v === "tv" || v === "phone");
  nav.innerHTML = VIEWS.map(([k, n]) => `<a href="#${k}" class="${k === v ? "on" : ""}">${n}</a>`).join("");
  if (v === "demo") app.innerHTML = tvHTML() + `<div class="phones">${["demo-1","demo-2","demo-3","demo-4"].map((c, i) => phoneHTML(c, "Phone " + (i + 1))).join("")}</div>` + controlHTML();
  if (v === "tv") app.innerHTML = tvHTML() + controlHTML();
  if (v === "phone") app.innerHTML = `<div class="single">${phoneHTML(me, "This tab")}</div>`;
  if (v === "control") app.innerHTML = controlHTML();
  if (v === "jury") app.innerHTML = juryHTML();
  document.querySelectorAll("[data-now]").forEach(n => n.scrollIntoView({block:"center"}));
};

/* cues: buzz the phone whose line is next, flash on your line */
const cues = prevLine => {
  if (S.line === prevLine) return;
  document.querySelectorAll(".phone[data-c]").forEach(p => {
    const c = p.dataset.c, mine = Object.keys(S.roles).find(r => S.roles[r] === c);
    const cur = CASE.lines[S.line], nxt = CASE.lines[S.line + 1], f = p.querySelector(".flash");
    let msg = "";
    if (cur && cur.who === mine) msg = "Your line";
    else if (nxt && nxt.who === mine) msg = "You're up next";
    const tl = msg === "Your line" ? cur : nxt;
    if (msg && f) { f.innerHTML = `<div style="text-align:center">${msg}${tl && TONES[tl.tone] ? `<div class="ft">${TONES[tl.tone][0]} ${TONES[tl.tone][1]}</div>` : ""}</div>`; f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); try { navigator.vibrate && navigator.vibrate(msg === "Your line" ? [120, 80, 120] : 200); } catch (e) {} }
  });
  const v = view(), l = CASE.lines[S.line];
  if ((v === "tv" || v === "demo") && l && l.sfx === "gavel") gavel();
};

function adopt(n) { const prev = S.line; S = n; render(); cues(prev); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.pick) { pick = d.pick; hl = -1; render(); }
  else if (d.jump !== undefined && b.closest(".jury")) {
    if (pick === "rec:all") { hl = +d.jump; render(); }
    else { pick = "rec:all"; hl = +d.jump; render(); }
    const t = document.querySelector(`.jury [data-line="${hl}"]`); if (t) t.scrollIntoView({block:"center"});
  }
  else if (d.seg) { const t = document.getElementById("seg-" + d.seg); if (t) t.scrollIntoView({block:"start"}); }
  else if (d.claim) claim(d.c, d.claim);
  else if (d.leave) leave(d.leave);
  else if (d.next) done(d.next);
  else if (d.step) go(+d.step);
  else if (d.free) freeRole(d.free);
  else if (d.reset) reset();
  else if (d.sound) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); gavel(); } catch (err) {} render(); }
});
window.addEventListener("hashchange", render);
render();
connect();
}
</script>
</body>
</html>
